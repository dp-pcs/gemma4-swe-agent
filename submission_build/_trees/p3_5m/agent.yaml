name: p3_root
agent_class: SequentialAgent
description: P3 parallel-solver agent. Stage 1 (locate) -> Stage 2 (3 parallel solvers in separate worktrees) -> Stage 3 (selector applies best candidate and submits).
sub_agents:
  - config_path: sub_agents/locate.yaml
  - config_path: sub_agents/solvers.yaml
  - config_path: sub_agents/selector.yaml
